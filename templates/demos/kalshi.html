<div class="demo" data-demo="kalshi">
  <h3>What’s behind a price move?</h3>
  <p class="demo-intro">The same initial jump can tell two very different stories. Replay a synthetic event to see the difference.</p>
  <div class="segmented" role="group" aria-label="Market event type"><button type="button" data-regime="temporary" aria-pressed="true">Temporary imbalance</button><button type="button" data-regime="information" aria-pressed="false">New information</button></div>
  <figure class="chart-figure">
    <div class="chart-top"><span>ILLUSTRATIVE CONTRACT PRICE</span><output class="market-price" aria-live="polite">68.0¢</output></div>
    <svg class="market-chart" viewBox="0 0 540 210" role="img" aria-label="Synthetic price path after a temporary imbalance or new information, from 0 to 60 seconds">
      <defs><pattern id="market-grid" width="110" height="50" patternUnits="userSpaceOnUse"><path d="M 110 0 L 0 0 0 50" fill="none" stroke="currentColor" stroke-opacity=".13" stroke-dasharray="2 4"/></pattern></defs>
      <rect x="44" y="18" width="462" height="152" fill="url(#market-grid)"/>
      <g class="axis"><text x="4" y="30">70¢</text><text x="4" y="100">60¢</text><text x="4" y="173">50¢</text><text x="44" y="197">0s</text><text x="148" y="197">15</text><text x="264" y="197">30</text><text x="379" y="197">45</text><text x="486" y="197">60s</text></g>
      <path class="reference-line" d="M44 170 H506"/>
      <path class="market-path" d="M44 40 L506 170"/>
      <line class="market-cursor" x1="44" x2="44" y1="18" y2="170"/>
      <circle class="market-dot" cx="44" cy="40" r="5"/>
    </svg>
    <figcaption class="chart-caption"><span class="legend-dot"></span><span class="regime-caption">Temporary pressure dissipates; the price tends back toward its starting level.</span></figcaption>
  </figure>
  <label class="range-label" for="market-time"><span>Seconds after the event</span><output id="market-time-value" for="market-time">0 s</output></label>
  <input id="market-time" type="range" min="0" max="60" value="0" step="1">
  <p class="fine-print">Synthetic mechanism sketch. No live prices or trading-performance claims.</p>
</div>
