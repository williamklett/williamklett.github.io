<div class="demo" data-demo="kalshi">
  <div class="project-title"><h2>Kalshi</h2><a href="https://kalshi.com/ideas/profiles/sharpeleopard">Profile ↗</a></div>
  <p class="project-description">{{ p.description }}</p>
  <dl class="earnings"><div><dt>Account growth</dt><dd>$150 <span>→</span> $8,000</dd></div><div><dt>Period</dt><dd>2 months</dd></div><div><dt>Settled trades</dt><dd>3,000+</dd></div></dl>
  <div class="market-instrument terminal-panel">
    <div class="instrument-label"><span>INFORMATION → EXECUTION</span><span class="market-event" aria-live="polite">Trading open</span></div>
    <figure class="flow-figure">
      <svg class="flow-graph desktop-flow" viewBox="0 0 720 180" role="img" aria-label="SWIM and DATIS feed three parallel colocated workers, racing to the trading desk">
        <g class="flow-lines" fill="none"><path class="packet-route" d="M113 55 H180 V90 H250 V68 H445 V90 H600"/><path class="packet-route" d="M113 125 H180 V90 H600"/><path class="packet-route" d="M113 125 H180 V90 H250 V112 H445 V90 H600"/></g>
        <g class="flow-node"><rect x="1" y="35" width="111" height="40"/><text x="56" y="60">SWIM</text><rect x="1" y="105" width="111" height="40"/><text x="56" y="130">DATIS</text><rect class="machine-box" x="230" y="22" width="235" height="132"/><text x="347" y="44">COLOCATED INFRASTRUCTURE</text><rect class="worker" x="272" y="56" width="150" height="22"/><text x="347" y="71">PARALLEL WORKER 01</text><rect class="worker" x="272" y="79" width="150" height="22"/><text x="347" y="94">PARALLEL WORKER 02</text><rect class="worker" x="272" y="102" width="150" height="22"/><text x="347" y="117">PARALLEL WORKER 03</text><rect x="600" y="61" width="119" height="58"/><text x="660" y="86">TRADING</text><text x="660" y="102">DESK</text></g>
        <circle class="flow-packet" r="3"/><circle class="flow-packet" r="3"/><circle class="flow-packet" r="3"/>
      </svg>
      <svg class="flow-graph mobile-flow" viewBox="0 0 360 220" role="img" aria-label="SWIM and DATIS feed three parallel colocated workers, then the trading desk">
        <g class="flow-lines" fill="none"><path class="packet-route" d="M70 43 V60 H90 V128 H180 V181"/><path class="packet-route" d="M290 43 V60 H180 V181"/><path class="packet-route" d="M290 43 V60 H270 V128 H180 V181"/></g>
        <g class="flow-node"><rect x="10" y="10" width="120" height="33"/><text x="70" y="32">SWIM</text><rect x="230" y="10" width="120" height="33"/><text x="290" y="32">DATIS</text><rect class="machine-box" x="28" y="75" width="304" height="74"/><text x="180" y="95">COLOCATED INFRASTRUCTURE</text><rect class="worker" x="48" y="107" width="74" height="26"/><text x="85" y="125">01</text><rect class="worker" x="143" y="107" width="74" height="26"/><text x="180" y="125">02</text><rect class="worker" x="238" y="107" width="74" height="26"/><text x="275" y="125">03</text><rect x="110" y="181" width="140" height="33"/><text x="180" y="203">TRADING DESK</text></g>
        <circle class="flow-packet" r="3"/><circle class="flow-packet" r="3"/><circle class="flow-packet" r="3"/>
      </svg>
    </figure>
    <figure class="market-figure">
      <svg class="market-chart" viewBox="0 0 650 240" role="img" aria-label="Schematic: settlement information arrives before the close; the desk fills stale quotes before market makers reprice">
        <g class="grid"><path d="M40 25 H622 M40 100 H622 M40 175 H622"/></g>
        <g class="axis"><text x="0" y="29">100¢</text><text x="6" y="104">50¢</text><text x="12" y="179">0¢</text><text x="40" y="222">OPEN</text><text x="188" y="222">RELEASE</text><text x="478" y="222">CLOSE</text></g>
        <rect class="information-window" x="206" y="20" width="316" height="163"/>
        <path class="quote-path bid-path"/><path class="quote-path ask-path"/><path class="price-path"/>
        <line class="news-line" x1="206" x2="206" y1="16" y2="192"/><line class="close-line" x1="522" x2="522" y1="16" y2="192"/>
        <circle class="fill-dot" r="4"/>
        <line class="market-cursor" y1="16" y2="192"/>
        <g class="market-closed" visibility="hidden"><rect x="180" y="56" width="345" height="80"/><text x="352" y="88">MARKETS WITHDRAWN</text><text x="352" y="112">RULES CHANGED</text></g>
      </svg>
      <figcaption class="market-legend"><span class="legend-bid">MM bid</span><span class="legend-ask">MM ask</span><span class="legend-price">Contract value</span><span class="legend-fill">Desk fill</span></figcaption>
    </figure>
  </div>
  <div class="playback"><button type="button" id="market-play" aria-label="Play market animation">Play ▶</button><input id="market-time" aria-label="Market sequence" type="range" min="0" max="100" value="0" step="0.1"><output id="market-time-value" for="market-time">0%</output></div>
  <p class="small-note">Schematic · prices and timing illustrative</p>
</div>
