<div class="demo" data-demo="loops">
  <div class="project-title"><h2>Looped transformers</h2><a href="https://github.com/williamklett/looped-readout-monitoring">Paper & code ↗</a></div>
  <div class="segmented" role="group" aria-label="Stopping schedule"><button type="button" data-schedule="fixed" aria-pressed="false">Fixed endpoint</button><button type="button" data-schedule="random" aria-pressed="true">Random stopping</button></div>
